version: "0.2"
language: en
dictionaries:
  - css
  - html
  - typescript
enableFiletypes:
  - ignore
  - properties
  - xml
files:
  - "**/.*"
  - "**/*.{css,js,json,jsonc,html,md,scss,svelte,svg,yaml,yml,xml}"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
ignoreRegExpList:
  # Korean (Hangul) content in the planning docs and UI mockup
  - "/[\\uAC00-\\uD7A3\\u3131-\\u318E]+/gu"
words:
  - bephigh
  - checkline
  - cooldown
  - CVEs
  - Decap
  - docpick
  - doctab
  - doctabs
  - edithint
  - esbuild
  - GHSA
  - Ghsas
  - Gowun
  - hostnames
  - jsdoc
  - keychip
  - kyoshino
  - libact
  - libbar
  - libcard
  - libgrid
  - libmeta
  - libtitle
  - needfix
  - Noto
  - oprow
  - pfoot
  - phead
  - pickcard
  - picklist
  - picksearch
  - PKCE
  - Pretendard
  - ptext
  - ptitle
  - regen
  - searchbar
  - setmode
  - singleline
  - stepper
  - Sveltia
  - tabbar
  - topbar
  - undici
  - unrs
  - uway
  - vtab
  - workerd
