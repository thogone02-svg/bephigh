version: "0.2"
language: en
dictionaries:
  - css
  - html
  - typescript
enableFiletypes:
  - ignore
  - properties
  - xml
files:
  - "**/.*"
  - "**/*.{css,js,json,jsonc,html,md,scss,svelte,svg,yaml,yml,xml}"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
ignoreRegExpList:
  # Korean (Hangul) content in the planning docs and UI mockup
  - "/[\\uAC00-\\uD7A3\\u3131-\\u318E]+/gu"
